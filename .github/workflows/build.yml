name: Track Dev Functions

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  track:
    name: Extract and Track Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2 

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the project
        run: ./gradlew build

      - name: Generate Dokka HTML
        run: ./gradlew :app:dokkaHtml

      - name: Generate Dokka JSON
         run: ls -R app/build/dokka/json || echo "No JSON files generated"

      - name: Install Python dependencies
        run: pip3 install beautifulsoup4

      # Ripristina snapshot JSON dalla run precedente (se esiste)
      - name: Download previous API snapshot
        uses: actions/download-artifact@v4
        with:
          name: dokka-api-snapshot
          path: docs/json
        continue-on-error: true

      # Confronta old.json con nuovo JSON
      - name: Compare API with Dokka JSON
        run: python scripts/compare_dokka.py

      # Salva il nuovo snapshot come artifact per la prossima run
      - name: Upload new API snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dokka-api-snapshot
          path: docs/json/old.json

      # Salva anche il log dei cambiamenti come artifact
      - name: Upload function change log
        uses: actions/upload-artifact@v4
        with:
          name: function-change-log-${{ github.sha }}
          path: function_change_log.md
