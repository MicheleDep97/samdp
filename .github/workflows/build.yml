name: Track Dev Functions

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  track:
    name: Extract and Track Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the project
        run: ./gradlew build

      - name: Generate Dokka HTML
        run: ./gradlew :app:dokkaHtml

      # (Facoltativo) piccolo debug
      - name: Debug Dokka pages.json
        run: |
          echo "=== pages.json files ==="
          find app/build/dokka -type f -name "pages.json" || echo "No pages.json"

      # Ripristina lo snapshot dalla cache (dell'ultimo run di questo branch)
      - name: Restore API snapshot (cache)
        uses: actions/cache/restore@v4
        with:
          path: docs/json
          key: dokka-snapshot-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dokka-snapshot-${{ github.ref_name }}-

      - name: Install Python dependencies
        run: pip3 install beautifulsoup4

      #  Confronto HTML + aggiornamento snapshot
      - name: Compare API with Dokka HTML
        run: python scripts/compare_dokka.py

      #  Artifact solo per consultazione
      - name: Upload function change log
        uses: actions/upload-artifact@v4
        with:
          name: function-change-log-${{ github.sha }}
          path: function_change_log.md

      - name: Upload new API snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dokka-api-snapshot
          path: docs/json/old.json

      #  Salva lo snapshot aggiornato in cache per la prossima run
      - name: Save API snapshot (cache)
        uses: actions/cache/save@v4
        with:
          path: docs/json
          key: dokka-snapshot-${{ github.ref_name }}-${{ github.run_id }}
